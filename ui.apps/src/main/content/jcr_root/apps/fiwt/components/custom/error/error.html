

<sly data-sly-use.model="com.adobe.aem.social.fiwt.core.models.ErrorModel"/>
<sly data-sly-use.templates="core/wcm/components/commons/v1/templates.html" />
<sly data-sly-call="${templates.placeholder @ isEmpty=!hasContent, classAppend='cmp-teaser'}"></sly>

<div class="container-xxl py-5 wow fadeInUp" data-wow-delay="0.1s" style="visibility: visible; animation-delay: 0.1s; animation-name: fadeInUp;">
            <div class="container text-center">
                <div class="row justify-content-center">
                    <div class="col-lg-6">
                        <i class="bi bi-exclamation-triangle display-1 text-primary"></i>
                        <h1 class="display-1">${model.error ? model.error : "404"}</h1>
                        <h1 class="mb-4">${model.error=="404" ? "Page" : "Resource"} Not Found</h1>
                        <p class="mb-4">${model.errorDescription}</p>
                        <a class="btn btn-primary py-3 px-5" href="${model.btnLink @ extension='html'}">${model.btnText}</a>
                    </div>
                </div>
            </div>
        </div>
